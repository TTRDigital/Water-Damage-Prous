# Builds the static site and uploads it to SiteGround over FTPS.
# Runs on every push to this branch or main, when Sanity publishes (webhook -> repository_dispatch),
# and from Actions > "Deploy to SiteGround" > Run workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SG_FTP_SERVER    FTP host from SiteGround Site Tools > Site > FTP Accounts
#   SG_FTP_USERNAME  FTP account whose home folder contains the site's public_html
#   SG_FTP_PASSWORD
#   GHL_WEBHOOK_URL  the forms' GoHighLevel inbound webhook (not set yet: the forms accept
#                    requests but do not forward them until it is added)
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SANITY_PROJECT_ID  optional; overrides the Sanity project in sanity/env.ts (q30nj6mr)
#   SG_FTP_DIR         optional; folder the site goes into, default ./public_html/
#   GHL_CHAT_WIDGET_ID optional; shows the GoHighLevel chat
#   GA_ID, GTM_ID      optional; GA4 defaults to the old site's tag G-F3JQ9WQY4G ("off" removes it)
name: Deploy to SiteGround

on:
  push:
    branches: [claude/magical-heisenberg-35ur38, main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # At job level so the steps' `if:` checks can see them.
    env:
      SG_FTP_SERVER: ${{ secrets.SG_FTP_SERVER }}
      # Written only into api/lead-config.php on SiteGround (never served, see .htaccess), not into
      # public/, because hosts without PHP would serve a .php file as text.
      GHL_WEBHOOK_URL: ${{ secrets.GHL_WEBHOOK_URL }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_GHL_CHAT_WIDGET_ID: ${{ vars.GHL_CHAT_WIDGET_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run lint && npm run typecheck

      - name: Build static site
        run: npm run build

      # Download from the run page for a manual upload (no form settings inside).
      - name: Keep a copy of the site
        uses: actions/upload-artifact@v4
        with:
          name: water-damage-pro-site
          path: out/
          include-hidden-files: true
          retention-days: 14

      - name: Write form settings
        if: env.GHL_WEBHOOK_URL != ''
        run: |
          php -r 'file_put_contents("out/api/lead-config.php", "<?php\nreturn " . var_export(["webhook_url" => getenv("GHL_WEBHOOK_URL")], true) . ";\n");'

      - name: Upload to SiteGround
        # Skipped (build check only) until the FTP secrets are added.
        if: env.SG_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SG_FTP_SERVER }}
          username: ${{ secrets.SG_FTP_USERNAME }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          # The FTP account's home is the site folder, so the files go into public_html.
          server-dir: ${{ vars.SG_FTP_DIR || './public_html/' }}
